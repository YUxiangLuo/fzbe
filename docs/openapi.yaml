openapi: 3.0.3
info:
  title: Fangzhen Backend API
  version: 1.0.0
  description: |
    根据当前后端代码整理的 OpenAPI 文档。

    返回约定：
    - 大多数 2xx JSON 响应会被全局中间件包装为 `{ "data": ... }`。
    - 少数已经包含顶层 `data` 的响应（例如 `/api/v1/users`、`/api/v1/users/search`）保持原样，不再二次包装。
    - 错误响应统一为 `{ "error": "..." }`，并可能带扩展字段（`details`、`invalid_rows`、`conflicts`、`current_class` 等）。
servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Auth
  - name: Users
  - name: Classes
  - name: Class Members
  - name: Datasets
  - name: Manuals
  - name: Question Bank
  - name: Quizzes
  - name: Experiments
  - name: Reports
  - name: Models
  - name: Grades
  - name: Tools
  - name: Files

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
        invalid_rows:
          type: array
          items:
            type: object
            additionalProperties: true
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: true
        current_class:
          type: object
          additionalProperties: true
        current_class_id:
          type: integer
        cleanup:
          type: object
          additionalProperties: true
      additionalProperties: true

    DataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true

    DataEnvelopeArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true

    Pagination:
      type: object
      required: [currentPage, pageSize, totalItems, totalPages]
      properties:
        currentPage:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    UserListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          $ref: '#/components/schemas/Pagination'

    UserSearchResponse:
      type: object
      required: [data, pagination, searchMethod]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchMethod:
          type: string
          enum: [fulltext, like]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        role:
          type: string
          enum: [Student, Teacher, Assistant, Admin]

    LoginSuccess:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
            user:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [Student, Teacher, Assistant, Admin]

    AdfPoint:
      type: object
      required: [month, sales]
      properties:
        month:
          type: string
        sales:
          type: number

    AdfRequest:
      type: object
      required: [series]
      properties:
        series:
          type: array
          minItems: 4
          items:
            $ref: '#/components/schemas/AdfPoint'

    ManualUpdateRequest:
      type: object
      properties:
        file_name:
          type: string
          minLength: 1
        description:
          type: string
        is_active:
          type: boolean

    QuestionCreateRequest:
      type: object
      required: [question_type, question_text, correct_answers]
      properties:
        knowledge_point:
          type: string
          minLength: 1
        question_type:
          type: string
          enum: ['Single Choice', 'Multiple Choice', 'True/False']
        question_text:
          type: string
          minLength: 1
        options:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: string
                minLength: 1
        correct_answers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1

    QuestionUpdateRequest:
      type: object
      minProperties: 1
      properties:
        knowledge_point:
          type: string
          minLength: 1
        question_type:
          type: string
          enum: ['Single Choice', 'Multiple Choice', 'True/False']
        question_text:
          type: string
          minLength: 1
        options:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: string
                minLength: 1
        correct_answers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1

    QuizSubmitRequest:
      type: object
      required: [experiment_id, answers]
      properties:
        experiment_id:
          type: integer
          minimum: 1
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [question_id, submitted_answer]
            properties:
              question_id:
                type: integer
                minimum: 1
              submitted_answer:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1

    SubmitReportRequest:
      type: object
      required: [report_content]
      properties:
        report_content:
          type: string
          minLength: 1
          maxLength: 500000
          description: 提交前会去除首尾空白；去空白后不能为空。

    SubmitReportResult:
      type: object
      required: [message, report_id, pdf_path]
      properties:
        message:
          type: string
          enum: [报告提交成功, 报告更新成功]
        report_id:
          type: integer
          minimum: 1
        pdf_path:
          type: string
          description: 可通过鉴权文件接口访问的相对路径。

    SubmitReportResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SubmitReportResult'

    ModelTrainRequestBase:
      type: object
      description: |
        `experiment_id` 为必填。其余数据集与窗口字段是可选的一致性校验字段；
        如果传入，必须与实验记录中的已保存值一致。
      required: [experiment_id]
      properties:
        experiment_id:
          type: integer
          minimum: 1
        selected_industry:
          type: string
          minLength: 1
        selected_company:
          type: string
          minLength: 1
        selected_product:
          type: string
          minLength: 1
        data_window_train_start_index:
          type: integer
          minimum: 0
        data_window_train_end_index:
          type: integer
          minimum: 0
        data_window_evaluate_start_index:
          type: integer
          minimum: 0
        data_window_evaluate_end_index:
          type: integer
          minimum: 0
        moving_average_window:
          type: integer
          minimum: 2
        exponential_smoothing_alpha:
          type: number
          minimum: 0
          maximum: 1
        arimaD:
          type: integer
          minimum: 0
        lstmFeatures:
          type: string
        lstmTargetFeature:
          type: string
        lstmNormalization:
          type: string
          enum: [minmax, zscore]
        models:
          type: string

    MovingAverageTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [moving_average_window]
          properties:
            moving_average_window:
              type: integer
              minimum: 2

    ExponentialSmoothingTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [exponential_smoothing_alpha]
          properties:
            exponential_smoothing_alpha:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1

    ArimaTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [arimaD]
          properties:
            arimaD:
              type: integer
              minimum: 0

    LstmTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [lstmFeatures, lstmTargetFeature, lstmNormalization]
          properties:
            lstmFeatures:
              type: string
              minLength: 1
            lstmTargetFeature:
              type: string
              minLength: 1
            lstmNormalization:
              type: string
              enum: [minmax, zscore]

    EnsembleTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [models]
          properties:
            models:
              type: string
              minLength: 1

    ModelTrainRequest:
      description: 请求体要求取决于路径参数 `model_type`。
      oneOf:
        - $ref: '#/components/schemas/MovingAverageTrainRequest'
        - $ref: '#/components/schemas/ExponentialSmoothingTrainRequest'
        - $ref: '#/components/schemas/ArimaTrainRequest'
        - $ref: '#/components/schemas/LstmTrainRequest'
        - $ref: '#/components/schemas/EnsembleTrainRequest'

    ModelPredictRequest:
      type: object
      required: [experiment_id, forecast_steps]
      properties:
        experiment_id:
          type: integer
          minimum: 1
        forecast_steps:
          type: integer
          minimum: 1

    ModelPrepareProductionRequest:
      type: object
      required: [experiment_id]
      properties:
        experiment_id:
          type: integer
          minimum: 1

    ClassUpdateRequest:
      type: object
      minProperties: 1
      properties:
        class_name:
          type: string
          minLength: 1
        class_code:
          type: string

    CreateStudentRequest:
      type: object
      required: [username, full_name]
      properties:
        username:
          type: string
          pattern: '^\\d{8,}$'
        full_name:
          type: string
          minLength: 2
          maxLength: 64
        email:
          type: string
          format: email
        phone_number:
          type: string
          pattern: '^\\d{6,15}$'
        password:
          type: string
          minLength: 6

    EnrollStudentRequest:
      type: object
      required: [student_id]
      properties:
        student_id:
          type: integer
          minimum: 1

    AddAssistantRequest:
      type: object
      required: [assistant_id]
      properties:
        assistant_id:
          type: integer
          minimum: 1

    DatasetUpdateRequest:
      type: object
      properties:
        data_name:
          type: string
          minLength: 1
        description:
          type: string

    ExperimentCreateRequest:
      type: object
      properties:
        status:
          type: string
          enum: ['Not Started', 'In Progress', 'Completed']
        current_step:
          type: integer
          minimum: 1
          maximum: 7
        highest_completed_step:
          type: integer
          minimum: 0
          maximum: 7
        selected_industry:
          type: string
          nullable: true
        selected_company:
          type: string
          nullable: true
        selected_product:
          type: string
          nullable: true
        selected_base_models:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        selected_ensemble_models:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        data_window_train_start_index:
          type: integer
          minimum: 0
          nullable: true
        data_window_train_end_index:
          type: integer
          minimum: 0
          nullable: true
        data_window_evaluate_start_index:
          type: integer
          minimum: 0
          nullable: true
        data_window_evaluate_end_index:
          type: integer
          minimum: 0
          nullable: true
        moving_average_completed:
          type: boolean
          nullable: true
        moving_average_window:
          type: integer
          minimum: 1
          nullable: true
        moving_average_metrics_rmse:
          type: number
          minimum: 0
          nullable: true
        moving_average_metrics_mae:
          type: number
          minimum: 0
          nullable: true
        moving_average_metrics_r2:
          type: number
          nullable: true
        exponential_smoothing_completed:
          type: boolean
          nullable: true
        exponential_smoothing_alpha:
          type: number
          minimum: 0
          nullable: true
        exponential_smoothing_metrics_rmse:
          type: number
          minimum: 0
          nullable: true
        exponential_smoothing_metrics_mae:
          type: number
          minimum: 0
          nullable: true
        exponential_smoothing_metrics_r2:
          type: number
          nullable: true
        arima_completed:
          type: boolean
          nullable: true
        arima_p:
          type: integer
          minimum: 0
          nullable: true
        arima_d:
          type: integer
          minimum: 0
          nullable: true
        arima_q:
          type: integer
          minimum: 0
          nullable: true
        arima_metrics_rmse:
          type: number
          minimum: 0
          nullable: true
        arima_metrics_mae:
          type: number
          minimum: 0
          nullable: true
        arima_metrics_r2:
          type: number
          nullable: true
        arima_adf_stationarity:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        lstm_completed:
          type: boolean
          nullable: true
        lstm_normalization:
          type: string
          enum: [minmax, zscore]
          nullable: true
        lstm_features:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        lstm_target_field:
          type: string
          nullable: true
        lstm_metrics_rmse:
          type: number
          minimum: 0
          nullable: true
        lstm_metrics_mae:
          type: number
          minimum: 0
          nullable: true
        lstm_metrics_r2:
          type: number
          nullable: true
        ensemble_weighted_completed:
          type: boolean
          nullable: true
        ensemble_weighted_base_models:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        ensemble_weighted_metrics_rmse:
          type: number
          minimum: 0
          nullable: true
        ensemble_weighted_metrics_mae:
          type: number
          minimum: 0
          nullable: true
        ensemble_weighted_metrics_r2:
          type: number
          nullable: true
        ensemble_boosting_completed:
          type: boolean
          nullable: true
        ensemble_boosting_base_models:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        ensemble_boosting_metrics_rmse:
          type: number
          minimum: 0
          nullable: true
        ensemble_boosting_metrics_mae:
          type: number
          minimum: 0
          nullable: true
        ensemble_boosting_metrics_r2:
          type: number
          nullable: true
        ensemble_stacking_completed:
          type: boolean
          nullable: true
        ensemble_stacking_base_models:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        ensemble_stacking_metrics_rmse:
          type: number
          minimum: 0
          nullable: true
        ensemble_stacking_metrics_mae:
          type: number
          minimum: 0
          nullable: true
        ensemble_stacking_metrics_r2:
          type: number
          nullable: true
        selected_best_model:
          type: string
          enum: [ma, exp, arima, lstm, ensemble_weighted, ensemble_boosting, ensemble_stacking]
          nullable: true
        quiz_about_model_completed:
          type: boolean
          nullable: true
        quiz_about_plan_completed:
          type: boolean
          nullable: true
        production_plan_completed:
          type: boolean
          nullable: true
        production_forecast_periods:
          type: integer
          minimum: 1
          nullable: true
        production_initial_inventory:
          type: number
          minimum: 0
          nullable: true
        production_target_service_level:
          type: number
          minimum: 0
          nullable: true
        production_safety_stock_z_score:
          type: number
          nullable: true
        production_mps_table:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        production_forecast_results:
          oneOf:
            - type: array
              items: {}
            - type: object
              additionalProperties: true
            - type: string
              nullable: true
        production_capacity_mode:
          type: string
          enum: [scenario, auto, custom]
          nullable: true
        production_capacity_scenario:
          type: string
          enum: [tight, normal, abundant]
          nullable: true
        production_capacity:
          type: integer
          minimum: 0
          nullable: true
        production_custom_capacity:
          type: integer
          minimum: 0
          nullable: true
        start_time:
          type: string
          format: date-time
          nullable: true
        last_activity_at:
          type: string
          format: date-time
          nullable: true
        completion_time:
          type: string
          format: date-time
          nullable: true
        total_active_duration_seconds:
          type: integer
          minimum: 0
          nullable: true
      additionalProperties: true

    ExperimentUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ExperimentCreateRequest'

    ExperimentEventRequest:
      type: object
      required: [step_order, event_type]
      properties:
        step_order:
          type: integer
          minimum: 1
          maximum: 7
        event_type:
          type: string
          enum: [STARTED, COMPLETED]

    GradeReportRequest:
      type: object
      properties:
        grade:
          type: number
          minimum: 0
          maximum: 100
        feedback:
          type: string
        status:
          type: string
          enum: [graded, rejected]
        experiment_grade:
          type: object
          properties:
            exp_flow_demand_data_preparation:
              type: number
              minimum: 0
              maximum: 100
            exp_flow_demand_descriptive_stats:
              type: number
              minimum: 0
              maximum: 100
            exp_flow_demand_model_selection:
              type: number
              minimum: 0
              maximum: 100
            exp_flow_demand_generate_results:
              type: number
              minimum: 0
              maximum: 100
            exp_flow_production_inventory_calc:
              type: number
              minimum: 0
              maximum: 100
            exp_flow_production_service_level:
              type: number
              minimum: 0
              maximum: 100
            exp_flow_production_variable_calc:
              type: number
              minimum: 0
              maximum: 100
            exp_flow_production_plan_creation:
              type: number
              minimum: 0
              maximum: 100
            exp_flow_report_submission:
              type: number
              minimum: 0
              maximum: 100
            model_quality:
              type: number
              minimum: 0
              maximum: 100

    UpdateGradeWeightsRequest:
      type: object
      minProperties: 1
      properties:
        exp_flow_weight:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_demand_data_preparation:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_demand_descriptive_stats:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_demand_model_selection:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_demand_generate_results:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_production_inventory_calc:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_production_service_level:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_production_variable_calc:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_production_plan_creation:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_report_submission:
          type: number
          minimum: 0
          maximum: 100
        model_quality_weight:
          type: number
          minimum: 0
          maximum: 100
        knowledge_test_weight:
          type: number
          minimum: 0
          maximum: 100
        report_quality_weight:
          type: number
          minimum: 0
          maximum: 100

    CreateAssistantSingleRequest:
      type: object
      required: [username, full_name]
      properties:
        username:
          type: string
          minLength: 3
        full_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^1\\d{10}$'
        password:
          type: string
          minLength: 6

    CreateTeacherRequest:
      type: object
      required: [username, full_name]
      properties:
        username:
          type: string
          minLength: 3
        full_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^1\\d{10}$'
        password:
          type: string
          minLength: 6

    CreateAssistantWithClassesRequest:
      type: object
      required: [username, password, full_name, email, class_ids]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6
        full_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone_number:
          type: string
        class_ids:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1

    UpdateCurrentUserRequest:
      type: object
      minProperties: 1
      properties:
        full_name:
          type: string
          minLength: 1
        phone_number:
          type: string
          minLength: 1
        email:
          type: string
          format: email

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 6

    AdminChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 6

    ResetPasswordRequest:
      type: object
      properties:
        newPassword:
          type: string
          minLength: 6
        new_password:
          type: string
          minLength: 6
          deprecated: true

  parameters:
    classId:
      name: classId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    teacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    assistantId:
      name: assistantId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    studentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    datasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    manualId:
      name: manualId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    questionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    experimentId:
      name: experimentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    reportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    industry:
      name: industry
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    company:
      name: company
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    product:
      name: product
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    modelType:
      name: model_type
      in: path
      required: true
      schema:
        type: string
        enum: [ma, es, arima, lstm, stacking, weighted_avg, boosting]
    filename:
      name: filename
      in: path
      required: true
      schema:
        type: string
    role:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum: [Student]
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    q:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1


  /api/v1/students/me/experiment-runs/retry:
    post:
      tags: [Experiments]
      summary: 从最新的已驳回报告创建完整重做实验
      operationId: retryRejectedExperiment
      description: >-
        首次请求创建仅含默认值的新实验并返回 201；同一报告的重复或并发请求
        只有在该子 attempt 仍是学生最新正式 attempt 且尚未生成报告时才幂等
        返回 200；Completed 但尚无报告的 child 仍返回 200，以支持报告提交中断
        恢复。child 一旦存在 submitted、graded 或 rejected 报告，或者已经存在
        更新一代 attempt，旧父报告请求返回 409 和 current。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentRetryRequest'
      responses:
        '200':
          description: 已存在该报告对应且尚无报告的最新重做实验（含 Completed 无报告恢复态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentStateResponse'
        '201':
          description: 重做实验创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentStateResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足（仅 Student）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 驳回报告不存在或不属于当前学生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 报告未驳回、child 已有报告、不是最新正式尝试，或重做关联冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentRetryConflictResponse'


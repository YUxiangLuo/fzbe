    teacherId:
      name: teacherId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    assistantId:
      name: assistantId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    studentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    datasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    manualId:
      name: manualId
      in: path
      required: true
      schema:
        type: string
        pattern: '^\\d+$'
    questionId:

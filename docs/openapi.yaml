          minimum: 0
          nullable: true
        production_custom_capacity:
          type: integer
          minimum: 0
          nullable: true

    ExperimentCreateRequest:
      type: object
      description: 创建时仅接受初始选择、数据窗口和模型参数草稿；流程结果与生产计划字段必须在对应流程中生成。
      additionalProperties: false
      properties:
        current_step:
          type: integer
          minimum: 1
          maximum: 7
        highest_completed_step:
          type: integer
          minimum: 0
          maximum: 7
        selected_industry:
          type: string
          nullable: true
        selected_company:
          type: string
          nullable: true
        selected_product:
          type: string
          nullable: true
        selected_base_models:
          type: array
          items:
            type: string
        selected_ensemble_models:
          type: array
          items:
            type: string
        data_window_train_start_index:
          type: integer
          minimum: 0
          nullable: true
        data_window_train_end_index:
          type: integer
          minimum: 0
          nullable: true
        data_window_evaluate_start_index:
          type: integer
          minimum: 0
          nullable: true
        data_window_evaluate_end_index:
          type: integer
          minimum: 0
          nullable: true
        moving_average_window:
          type: integer
          minimum: 2
          nullable: true
        exponential_smoothing_alpha:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1
          nullable: true
        arima_d:
          type: integer
          minimum: 0
          maximum: 2
          nullable: true
        arima_adf_stationarity:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
        lstm_normalization:
          type: string
          enum: [minmax, zscore]
          nullable: true
        lstm_features:
          type: array
          nullable: true
          items:
            type: string
        lstm_target_field:
          type: string
          nullable: true
        ensemble_weighted_base_models:
          type: array
          nullable: true
          items:
            type: string
        ensemble_boosting_base_models:
          type: array
          nullable: true
          items:
            type: string
        ensemble_stacking_base_models:
          type: array
          nullable: true
          items:
            type: string

    ExperimentRetryRequest:
      type: object
      required: [rejected_report_id]
      additionalProperties: false
      properties:
        rejected_report_id:
          type: integer
          minimum: 1
          description: 属于当前学生且状态为 rejected 的最新正式报告 ID。

    ExperimentUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ExperimentStudentWritableFields'
        - type: object
          required: [expected_version]
          minProperties: 2
          properties:
            expected_version:
              type: integer
              minimum: 0
              description: 最近一次读取到的 state_version；不匹配时返回 409。

    ExperimentEventRequest:
      type: object
      required: [step_order, event_type]
      properties:
        step_order:
          type: integer
          minimum: 1
          maximum: 7
        event_type:
          type: string
          enum: [STARTED, COMPLETED]

    GradeReportRequest:
      type: object
      required: [expected_status, expected_review_revision]
      description: >-
        每次写入都必须通过 expected_status 和 expected_review_revision 声明评阅页面
        打开时读取到的完整评阅快照。服务端锁定报告及实验成绩后重新计算并比较；
        状态、报告得分、评语、评阅人或任一可修改实验分项发生变化都返回 409。
        因此两个从 graded 打开的页面也不能静默互相覆盖，同时最新令牌仍允许显式
        修订已评分记录。省略 status 时会对当前记录保存部分评阅草稿（分数、分项或
        评语）并保持原状态；submitted 状态下的草稿分数不属于正式成绩。
        status=graded 时 grade 必填；status=rejected 时 expected_status 必须为
        submitted，feedback 必须为非空驳回原因，且不得携带 grade 或
        experiment_grade。rejected 为终态；已评分记录不能通过此接口改为 rejected。
        任何评阅都只允许作用于学生最新的正式实验，历史 attempt 返回 409。
      properties:
        expected_status:
          type: string
          enum: [submitted, graded]
          description: 评阅页面最近读取到的报告状态；与锁定后的当前状态不一致时返回 409。
        expected_review_revision:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: 评阅页面打开时读取到的 review_revision；与锁定后的完整评阅快照不一致时返回 409。
        grade:
          type: number
          minimum: 0
          maximum: 100
        feedback:
          type: string
          description: 非驳回写入中，空白字符串会清除已有评语；驳回时必须为非空原因。
        status:
          type: string
          enum: [graded, rejected]
        experiment_grade:
          type: object
          minProperties: 1
          description: 各可选实验分项；传 null 表示清除该分项，省略表示保持原值。
          properties:
            exp_flow_demand_data_preparation:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            exp_flow_demand_descriptive_stats:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            exp_flow_demand_model_selection:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            exp_flow_demand_generate_results:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            exp_flow_production_inventory_calc:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            exp_flow_production_service_level:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            exp_flow_production_variable_calc:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            exp_flow_production_plan_creation:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            exp_flow_report_submission:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            model_quality:
              type: number
              nullable: true
              minimum: 0
              maximum: 100

    UpdateGradeWeightsRequest:
      type: object
      minProperties: 1
      properties:
        exp_flow_weight:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_demand_data_preparation:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_demand_descriptive_stats:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_demand_model_selection:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_demand_generate_results:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_production_inventory_calc:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_production_service_level:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_production_variable_calc:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_production_plan_creation:
          type: number
          minimum: 0
          maximum: 100
        exp_flow_report_submission:
          type: number
          minimum: 0
          maximum: 100
        model_quality_weight:
          type: number
          minimum: 0
          maximum: 100
        knowledge_test_weight:
          type: number
          minimum: 0
          maximum: 100
        report_quality_weight:
          type: number
          minimum: 0
          maximum: 100

    CreateAssistantSingleRequest:
      type: object
      required: [username, full_name]
      properties:
        username:
          type: string
          minLength: 3
        full_name:
          type: string
          minLength: 1
        email:
          type: string

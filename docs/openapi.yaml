      schema:
        oneOf:
          - type: string
            pattern: '^\\d+$'
          - type: string
            enum: [current]
    industry:
      name: industry
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    company:
      name: company
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    product:

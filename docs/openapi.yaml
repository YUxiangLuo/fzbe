paths:
  /api/v1/health:
    get:
      tags: [Runtime]
      summary: 服务健康检查
      operationId: getHealth
      description: 仅返回应用标识和健康状态，不暴露数据库、容量或运行时配置。
      security: []
      responses:
        '200':
          description: 服务已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/client-config:
    get:
      tags: [Runtime]
      summary: 获取客户端运行配置
      operationId: getClientConfig
      description: 返回已认证客户端执行请求所需的非敏感配置；当前仅包含报告 PDF 排队和生成超时。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfigResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/runtime-info:
    get:
      tags: [Runtime]
      summary: 获取后端运行时与并发配置
      operationId: getRuntimeInfo
      description: 仅 Admin 可访问。返回当前后端生效的数据库、模型/PDF 并发、超时和 PDF 队列瞬时状态，用于部署核对与课堂监控。E2E_SERVER 测试进程会在凭据创建前临时公开同一路径，以校验一次性数据库和容量配置。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足（仅 Admin）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sessions:
    post:
      tags: [Auth]
      summary: 登录
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 角色不匹配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 登录尝试过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tools/adf:
    post:
      tags: [Tools]
      summary: 执行 ADF 检验
      operationId: runAdf
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdfRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: ADF 输入序列无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足（仅 Student）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 模型计算容量已满
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/manuals:
    post:
      tags: [Manuals]
      summary: 上传实验手册
      operationId: uploadManual
      description: 仅 Admin 可访问
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, file_name]
              properties:
                file:
                  type: string
                  format: binary
                file_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                description:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: 参数或文件错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Manuals]
      summary: 获取手册列表
      operationId: listManuals
      description: 仅 Admin 可访问
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeArray'
        '403':
          description: 权限不足（仅 Admin）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/manuals/active:
    get:
      tags: [Manuals]
      summary: 获取当前激活手册
      operationId: getActiveManual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到激活手册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/manuals/{manualId}:
    put:
      tags: [Manuals]
      summary: 更新手册
      operationId: updateManual
      description: 仅 Admin 可访问
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/manualId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足（仅 Admin）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 手册不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Manuals]
      summary: 删除手册
      operationId: deleteManual
      description: 仅 Admin 可访问
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/manualId'
      responses:
        '200':
          description: >-
            手册数据库记录已删除；cleanup_pending=true 时文件已安全隔离，后台任务将继续清理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedFileDeletionResponse'
        '403':
          description: 权限不足（仅 Admin）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 手册不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 手册文件无法安全隔离，数据库删除未执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/question-bank/questions:
    get:
      tags: [Question Bank]
      summary: 获取题库
      operationId: listQuestions
      description: Teacher/Assistant/Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelopeArray'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [Question Bank]
      summary: 创建题目
      operationId: createQuestion
      description: Teacher/Assistant/Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEnvelope'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:

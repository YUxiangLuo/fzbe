openapi: 3.0.3
info:
  title: Fangzhen Backend API
  version: 1.0.0
  description: |
    根据当前后端代码整理的 OpenAPI 文档。

    返回约定：
    - 大多数 2xx JSON 响应会被全局中间件包装为 `{ "data": ... }`。
    - 少数已经包含顶层 `data` 的响应（例如 `/api/v1/users`、`/api/v1/users/search`）保持原样，不再二次包装。
    - 错误响应统一为 `{ "error": "..." }`，并可能带扩展字段（`details`、`invalid_rows`、`conflicts`、`current_class` 等）。
servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Auth
  - name: Users
  - name: Classes
  - name: Class Members
  - name: Datasets
  - name: Manuals
  - name: Question Bank
  - name: Quizzes
  - name: Experiments
  - name: Reports
  - name: Models
  - name: Grades
  - name: Academic Terms
  - name: Tools
  - name: Runtime
  - name: Files

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: 可供客户端稳定分支处理的机器可读错误码。
        required_action:
          type: string
          enum: [prepare, retrain]
          description: 当前操作无法原地重试时，客户端应引导用户执行的恢复动作。
        model_type:
          type: string
          enum: [ma, es, arima, lstm, weighted_avg, boosting, stacking]
          description: 恢复动作所针对的模型类型。
        base_model:
          type: string
          enum: [ma, es, arima, lstm]
          description: 融合模型错误中需要恢复的基础模型类型。
        details:
          type: object
          additionalProperties: true
        invalid_rows:
          type: array
          items:
            type: object
            additionalProperties: true
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: true
        current_class:
          type: object
          additionalProperties: true
        current_class_id:
          type: integer
        cleanup:
          type: object
          additionalProperties: true
      additionalProperties: true

    GradeReportConflictResponse:
      type: object
      required: [error, current_status]
      properties:
        error:
          type: string
        current_status:
          type: string
          enum: [submitted, graded, rejected]
          description: 服务端锁定报告后读取到的权威状态；客户端应刷新后重新评阅。
      additionalProperties: false

    GradeReportSuccessResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [review_revision]
          properties:
            review_revision:
              type: string
              pattern: '^[a-f0-9]{64}$'
              readOnly: true
              description: 更新完成后的新评阅版本令牌；下一次修改必须原样回传。
          additionalProperties: true
      additionalProperties: false

    ProductionPlanErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - PRODUCTION_PLAN_INVALID
            - PRODUCTION_PLAN_MISMATCH
            - PRODUCTION_FORECAST_LEGACY_REJECTED
            - PRODUCTION_FORECAST_EVIDENCE_REQUIRED
            - PRODUCTION_FORECAST_EVIDENCE_INVALID
            - PRODUCTION_FORECAST_EVIDENCE_STALE
      additionalProperties: false

    ExperimentRetryConflictCurrent:
      type: object
      description: >-
        REJECTED_REPORT_NOT_LATEST 冲突中用于恢复学生路由的权威实验快照。
        这里只约束恢复流程实际依赖的字段；响应仍可携带完整实验状态。旧版已完成
        实验可能保存 current_step >= 8，两个测验完成标志也可能缺失或为 null，
        客户端须把缺失/null 规范化为 false 后再执行路由判断。
      required:
        - experiment_id
        - student_id
        - state_version
        - status
        - current_step
        - highest_completed_step
      properties:
        experiment_id:
          type: integer
          minimum: 1
        student_id:
          type: integer
          minimum: 1
        retry_of_experiment_id:
          type: integer
          minimum: 1
          nullable: true
        state_version:
          type: integer
          minimum: 0
        status:
          type: string
          enum: ['Not Started', 'In Progress', 'Completed']
        current_step:
          type: integer
          minimum: 1
          description: 新记录为 1-7；历史报告态可能为 8 或更大。
        highest_completed_step:
          type: integer
          minimum: 0
          maximum: 7
        quiz_about_model_completed:
          type: boolean
          nullable: true
          description: 兼容历史快照，可缺失或为 null；客户端按 false 处理。
        quiz_about_plan_completed:
          type: boolean
          nullable: true
          description: 兼容历史快照，可缺失或为 null；客户端按 false 处理。
      additionalProperties: true

    ExperimentRetryConflictResponse:
      oneOf:
        - type: object
          required: [error, code, current]
          properties:
            error:
              type: string
            code:
              type: string
              enum: [REJECTED_REPORT_NOT_LATEST]
            current:
              $ref: '#/components/schemas/ExperimentRetryConflictCurrent'
          additionalProperties: false
        - type: object
          required: [error, code]
          properties:
            error:
              type: string
            code:
              type: string
              enum:
                - REPORT_NOT_REJECTED
                - REJECTED_EXPERIMENT_NOT_COMPLETED
                - INVALID_RETRY_LINEAGE
          additionalProperties: false
      discriminator:
        propertyName: code

    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [app, status]
          properties:
            app:
              type: string
              enum: [fangzhen-be]
            status:
              type: string
              enum: [ok]
          additionalProperties: false
      additionalProperties: false

    ClientConfigResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [reportSubmission]
          properties:
            reportSubmission:
              type: object
              required: [pdfQueueMs, pdfGenerationMs]
              properties:
                pdfQueueMs:
                  type: integer
                  minimum: 1
                pdfGenerationMs:
                  type: integer
                  minimum: 1
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false

    DataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true

    DataEnvelopeArray:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true

    ManagedFileDeletionResponse:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [message, cleanup_pending]
          additionalProperties: false
          properties:
            message:
              type: string
            cleanup_pending:
              type: boolean
              description: true 表示数据库删除已提交，隔离文件将由后台恢复任务继续清理。

    Pagination:
      type: object
      required: [currentPage, pageSize, totalItems, totalPages]
      properties:
        currentPage:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    UserListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          $ref: '#/components/schemas/Pagination'

    UserSearchResponse:
      type: object
      required: [data, pagination, searchMethod]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchMethod:
          type: string
          enum: [fulltext, like]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        role:
          type: string
          enum: [Student, Teacher, Assistant, Admin]

    LoginSuccess:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
            user:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [Student, Teacher, Assistant, Admin]

    AdfPoint:
      type: object
      required: [month, sales]
      properties:
        month:
          type: string
        sales:
          oneOf:
            - type: number
            - type: string
              minLength: 1

    AdfRequest:
      type: object
      required: [series]
      properties:
        series:
          type: array
          minItems: 4
          maxItems: 5000
          items:
            $ref: '#/components/schemas/AdfPoint'

    ManualUpdateRequest:
      type: object
      properties:
        file_name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 200
        is_active:
          type: boolean

    QuestionCreateRequest:
      type: object
      required: [question_type, question_text, correct_answers]
      properties:
        knowledge_point:
          type: string
          minLength: 1
        question_type:
          type: string
          enum: ['Single Choice', 'Multiple Choice', 'True/False']
        question_text:
          type: string
          minLength: 1
        options:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: string
                minLength: 1
        correct_answers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1

    QuestionUpdateRequest:
      type: object
      minProperties: 1
      properties:
        knowledge_point:
          type: string
          minLength: 1
        question_type:
          type: string
          enum: ['Single Choice', 'Multiple Choice', 'True/False']
        question_text:
          type: string
          minLength: 1
        options:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: string
                minLength: 1
        correct_answers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1

    QuizSubmitRequest:
      type: object
      required: [experiment_id, answers]
      properties:
        experiment_id:
          type: integer
          minimum: 1
        answers:
          type: array
          minItems: 1
          items:
            type: object
            required: [question_id, submitted_answer]
            properties:
              question_id:
                type: integer
                minimum: 1
              submitted_answer:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1

    SubmitReportRequest:
      type: object
      required: [report_content]
      properties:
        report_content:
          type: string
          minLength: 1
          maxLength: 500000
          description: 提交前会去除首尾空白；去空白后不能为空。

    SubmitReportResult:
      type: object
      required: [message, report_id, pdf_path]
      properties:
        message:
          type: string
          enum: [报告提交成功, 报告更新成功]
        report_id:
          type: integer
          minimum: 1
        pdf_path:
          type: string
          description: 可通过鉴权文件接口访问的相对路径。

    SubmitReportResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SubmitReportResult'

    LatestReportExperimentSummary:
      type: object
      required:
        - experiment_id
        - student_id
        - retry_of_experiment_id
        - status
        - current_step
        - start_time
        - last_activity_at
        - completion_time
      properties:
        experiment_id:
          type: integer
          minimum: 1
        student_id:
          type: integer
          minimum: 1
        retry_of_experiment_id:
          type: integer
          minimum: 1
          nullable: true
        status:
          type: string
          enum: ['Not Started', 'In Progress', 'Completed']
        current_step:
          type: integer
          minimum: 1
          maximum: 7
        start_time:
          type: string
          format: date-time
          nullable: true
        last_activity_at:
          type: string
          format: date-time
          nullable: true
        completion_time:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false

    LatestReportRecord:
      type: object
      required:
        - report_id
        - experiment_id
        - student_id
        - status
        - submitted_at
        - pdf_file_path
        - pdf_file_available
      properties:
        report_id:
          type: integer
          minimum: 1
        experiment_id:
          type: integer
          minimum: 1
        student_id:
          type: integer
          minimum: 1
        report_content:
          type: string
          nullable: true
        pdf_file_path:
          type: string
          nullable: true
          description: 可通过鉴权文件接口访问的相对路径。
        pdf_file_available:
          type: boolean
        status:
          type: string
          enum: [submitted, graded, rejected]
        submitted_at:
          type: string
          format: date-time
          nullable: true
        grade:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        feedback:
          type: string
          nullable: true
        graded_by:
          type: integer
          minimum: 1
          nullable: true
      additionalProperties: true

    LatestReportStatus:
      type: object
      required: [is_rejected, has_report, redo_in_progress]
      description: >-
        has_report 仅表示最新 attempt 是否已有报告。redo_in_progress=true 仅表示
        重做 child 尚未提交报告。只要最新 attempt 是从已驳回父报告创建的重做，
        rejected_report 都稳定返回父报告的驳回原因和归档 PDF；child 进入
        submitted 或 graded 后仍与当前 report 同时返回。
      properties:
        is_rejected:
          type: boolean
          description: 最新 attempt 自身的报告是否已驳回。
        has_report:
          type: boolean
        redo_in_progress:
          type: boolean
        experiment:
          $ref: '#/components/schemas/LatestReportExperimentSummary'
        report:
          $ref: '#/components/schemas/LatestReportRecord'
        rejected_report:
          description: 最新 retry attempt 的直接父驳回报告只读归档摘要。
          allOf:
            - $ref: '#/components/schemas/LatestReportRecord'
      additionalProperties: false

    LatestReportStatusResponse:
      type: object
      description: 全局成功响应中间件会把最新报告状态包装在 data 字段内。
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/LatestReportStatus'
      additionalProperties: false

    ClassReportArchivedRejection:
      type: object
      required:
        - report_id
        - experiment_id
        - status
        - feedback
        - grader_name
        - submitted_at
        - pdf_file_path
        - pdf_file_available
      properties:
        report_id:
          type: integer
          minimum: 1
        experiment_id:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [rejected]
        feedback:
          type: string
          nullable: true
        grader_name:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        pdf_file_path:
          type: string
          nullable: true
        pdf_file_available:
          type: boolean
      additionalProperties: false

    ClassReportRecord:
      type: object
      required:
        - user_id
        - username
        - full_name
        - report_id
        - experiment_id
        - retry_of_experiment_id
        - status
        - submitted_at
        - pdf_file_path
        - pdf_file_available
        - grade
        - feedback
        - grader_name
        - review_revision
        - rejected_report
        - experiment_grade
      properties:
        user_id:
          type: integer
          minimum: 1
        username:
          type: string
        full_name:
          type: string
        report_id:
          type: integer
          minimum: 1
          nullable: true
          description: 最新 attempt 尚未提交报告时为 null；不会借用父驳回报告 ID。
        experiment_id:
          type: integer
          minimum: 1
          nullable: true
        retry_of_experiment_id:
          type: integer
          minimum: 1
          nullable: true
        status:
          type: string
          enum: [submitted, graded, rejected, redo_in_progress]
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        pdf_file_path:
          type: string
          nullable: true
          description: 最新 attempt 当前报告的鉴权相对路径；重做尚未提交时为 null。
        pdf_file_available:
          type: boolean
        grade:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        feedback:
          type: string
          nullable: true
        grader_name:
          type: string
          nullable: true
        review_revision:
          type: string
          pattern: '^[a-f0-9]{64}$'
          nullable: true
          readOnly: true
          description: >-
            当前报告及可修改实验分项的 opaque 乐观并发令牌；report_id 为 null 时也为
            null。评阅页面必须保留打开时的值并在写入时原样回传。
        rejected_report:
          type: object
          nullable: true
          description: >-
            最新 attempt 为重做记录且其直接父报告已驳回时，始终返回父报告的
            只读归档摘要；当前 child 已 submitted 或 graded 后仍保留。
          allOf:
            - $ref: '#/components/schemas/ClassReportArchivedRejection'
        experiment_grade:
          type: object
          nullable: true
          description: >-
            最新 attempt 尚未提交报告时为 null；报告已提交后返回自动评阅证据及
            可修改的实验分项。
          properties:
            exp_flow_demand_data_preparation:
              type: number
              nullable: true
            exp_flow_demand_descriptive_stats:
              type: number
              nullable: true
            exp_flow_demand_model_selection:
              type: number
              nullable: true
            exp_flow_demand_generate_results:
              type: number
              nullable: true
            exp_flow_production_inventory_calc:
              type: number
              nullable: true
            exp_flow_production_service_level:
              type: number
              nullable: true
            exp_flow_production_variable_calc:
              type: number
              nullable: true
            exp_flow_production_plan_creation:
              type: number
              nullable: true
            exp_flow_report_submission:
              type: number
              nullable: true
            model_quality:
              type: number
              nullable: true
          additionalProperties: false
      additionalProperties: false

    ClassReportArray:
      type: array
      items:
        $ref: '#/components/schemas/ClassReportRecord'

    ClassReportArrayResponse:
      type: object
      description: 全局成功响应中间件会把班级报告数组包装在 data 字段内。
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClassReportArray'
      additionalProperties: false

    ModelTrainRequestBase:
      type: object
      description: |
        `experiment_id` 为必填。其余数据集与窗口字段是可选的一致性校验字段；
        如果传入，必须与实验记录中的已保存值一致。
      required: [experiment_id]
      properties:
        experiment_id:
          type: integer
          minimum: 1
        selected_industry:
          type: string
          minLength: 1
        selected_company:
          type: string
          minLength: 1
        selected_product:
          type: string
          minLength: 1
        data_window_train_start_index:
          type: integer
          minimum: 0
        data_window_train_end_index:
          type: integer
          minimum: 0
        data_window_evaluate_start_index:
          type: integer
          minimum: 0
        data_window_evaluate_end_index:
          type: integer
          minimum: 0
        moving_average_window:
          type: integer
          minimum: 2
        exponential_smoothing_alpha:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
        arimaD:
          type: integer
          minimum: 0
        lstmFeatures:
          description: 最多 64 个附加输入特征；目标字段不计入上限。旧客户端可传逗号分隔字符串；字段名本身含逗号时必须使用 JSON 数组。
          oneOf:
            - type: string
              minLength: 1
            - type: array
              maxItems: 64
              items:
                type: string
                minLength: 1
        lstmTargetFeature:
          type: string
        lstmNormalization:
          type: string
          enum: [minmax, zscore]
        models:
          type: string

    MovingAverageTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [moving_average_window]
          properties:
            moving_average_window:
              type: integer
              minimum: 2

    ExponentialSmoothingTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [exponential_smoothing_alpha]
          properties:
            exponential_smoothing_alpha:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1

    ArimaTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [arimaD]
          properties:
            arimaD:
              type: integer
              minimum: 0

    LstmTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [lstmFeatures, lstmTargetFeature, lstmNormalization]
          properties:
            lstmFeatures:
              description: 最多 64 个附加输入特征；目标字段不计入上限。空数组表示仅使用目标序列；字段名本身含逗号时必须使用 JSON 数组。
              oneOf:
                - type: string
                  minLength: 1
                - type: array
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
            lstmTargetFeature:
              type: string
              minLength: 1
            lstmNormalization:
              type: string
              enum: [minmax, zscore]

    EnsembleWithoutLstmTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [models]
          properties:
            models:
              type: string
              minLength: 1
              maxLength: 64
              description: 以逗号分隔的至少两个、不重复的基础模型；此分支不得包含 LSTM。
              not:
                pattern: '(^|,)\s*lstm\s*(,|$)'

    EnsembleWithLstmTrainRequest:
      allOf:
        - $ref: '#/components/schemas/ModelTrainRequestBase'
        - type: object
          required: [models, lstmFeatures, lstmTargetFeature, lstmNormalization]
          properties:
            models:
              type: string
              minLength: 1
              maxLength: 64
              description: 以逗号分隔的至少两个、不重复的基础模型，且包含 LSTM。
              pattern: '(^|,)\s*lstm\s*(,|$)'
            lstmFeatures:
              description: 显式选择的 LSTM 附加输入特征，最多 64 个（目标字段不计入上限）；空数组表示仅使用目标序列，不会自动选择全部特征；字段名本身含逗号时必须使用 JSON 数组。
              oneOf:
                - type: string
                  minLength: 1
                - type: array
                  maxItems: 64
                  items:
                    type: string
                    minLength: 1
            lstmTargetFeature:
              type: string
              minLength: 1
              maxLength: 255
            lstmNormalization:
              type: string
              enum: [minmax, zscore]

    EnsembleTrainRequest:
      oneOf:
        - $ref: '#/components/schemas/EnsembleWithoutLstmTrainRequest'
        - $ref: '#/components/schemas/EnsembleWithLstmTrainRequest'

    ModelTrainRequest:
      description: 请求体要求取决于路径参数 `model_type`。
      oneOf:
        - $ref: '#/components/schemas/MovingAverageTrainRequest'
        - $ref: '#/components/schemas/ExponentialSmoothingTrainRequest'
        - $ref: '#/components/schemas/ArimaTrainRequest'
        - $ref: '#/components/schemas/LstmTrainRequest'
        - $ref: '#/components/schemas/EnsembleTrainRequest'

    ModelPredictRequest:
      type: object
      required: [experiment_id, forecast_steps, preparation_token]
      properties:
        experiment_id:
          type: integer
          minimum: 1
        forecast_steps:
          type: integer
          minimum: 2
          maximum: 12
        preparation_token:
          type: string
          format: uuid

    ModelPrepareProductionRequest:
      type: object
      required: [experiment_id, forecast_steps]
      properties:
        experiment_id:
          type: integer
          minimum: 1
        forecast_steps:
          type: integer
          minimum: 2
          maximum: 12

    ProductionPredictionPoint:
      type: object
      required:
        - prediction
        - std_dev
        - upper_error_p99
        - uncertainty_source
        - calibration_mean_error
        - calibration_count
        - interval_lower
        - interval_upper
        - interval_level
        - interval_kind
        - coverage_claim
      properties:
        prediction:
          type: number
          minimum: 0
        std_dev:
          type: number
          minimum: 0
          description: 客户安全库存公式使用的中心化误差标准差。
        upper_error_p99:
          type: number
          minimum: 0
          description: 单侧 P99 误差压力偏移，仅用于独立诊断；当前客户安全库存与产能公式不读取该字段。
        uncertainty_source:
          type: string
          enum: [model, empirical, fallback]
        uncertainty_reason:
          type: string
        calibration_source:
          type: string
          minLength: 1
        calibration_mean_error:
          type: number
          nullable: true
          description: 与 calibration_count 同时为 null，或同时提供有效校准诊断。
        calibration_count:
          type: integer
          minimum: 1
          nullable: true
          description: 与 calibration_mean_error 同时为 null，或同时提供有效校准诊断。
        bias_diagnostic_source:
          type: string
          nullable: true
          description: 平均偏差诊断的数据来源；ARIMA 使用 outer_selection_assessment，与模型原生区间来源分离。
        interval_lower:
          type: number
        interval_upper:
          type: number
        interval_level:
          type: number
          enum: [0.95]
          description: 区间构造水平；必须结合 interval_kind 与 coverage_claim 解释，不能单独视为覆盖保证。
        interval_kind:
          type: string
          enum:
            - model_prediction_interval
            - empirical_residual_quantile
            - normal_approximation
            - fallback_normal_approximation
        coverage_claim:
          type: string
          enum: [model_nominal, none]
          description: model_nominal 表示模型分布假设下的名义覆盖；none 表示不声明有限样本覆盖保证。
      oneOf:
        - title: 模型名义预测区间
          properties:
            interval_kind:
              type: string
              enum: [model_prediction_interval]
            coverage_claim:
              type: string
              enum: [model_nominal]
        - title: 不声明覆盖保证的区间
          properties:
            interval_kind:
              type: string
              enum:
                - empirical_residual_quantile
                - normal_approximation
                - fallback_normal_approximation
            coverage_claim:
              type: string
              enum: [none]

    ProductionMpsRow:
      type: object

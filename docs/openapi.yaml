            $ref: '#/components/schemas/ProductionMpsRow'
        production_forecast_results:
          type: array
          nullable: true
          maxItems: 12
          items:
            $ref: '#/components/schemas/ProductionPredictionPoint'
        production_forecast_evidence:
          type: string
          maxLength: 4096
          nullable: true
        production_capacity_mode:
          type: string

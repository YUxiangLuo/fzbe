        full_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^1\\d{10}$'
        password:
          type: string
          minLength: 6

    CreateAssistantWithClassesRequest:
      type: object

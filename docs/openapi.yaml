    LegacyProductionPredictionPoint:
      type: object
      description: |
        仅用于读取已完成历史实验。旧版预测早于不确定性和区间元数据，
        不得作为新建或更新实验的写入格式。
      required: [prediction, std_dev]
      properties:
        prediction:
          type: number
          minimum: 0
        std_dev:
          type: number
          minimum: 0
        interval_lower:
          type: number
        interval_upper:
          type: number
        interval_level:
          type: number
        interval_kind:
          type: string
        coverage_claim:
          type: string
      not:
        anyOf:
          - properties:
              interval_lower: {}
            required: [interval_lower]
          - properties:
              interval_upper: {}
            required: [interval_upper]
          - properties:
              interval_level: {}
            required: [interval_level]
          - properties:
              interval_kind: {}
            required: [interval_kind]
          - properties:
              coverage_claim: {}
            required: [coverage_claim]
      additionalProperties: true

    CompatiblePersistedProductionForecastResults:
      description: |
        已完成历史实验可能返回整组旧版预测；当前实验返回整组新版预测。
        同一数组不会混用两个版本，部分区间元数据也不会被返回。
      oneOf:
        - type: array
          nullable: true
          minItems: 1
          maxItems: 12

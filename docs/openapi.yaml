        '200':
          description: 兼容性更新成功（正常流程下较少出现）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitReportResponse'
        '201':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitReportResponse'
        '401':
          description: 未授权或 token 无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: 内容无效

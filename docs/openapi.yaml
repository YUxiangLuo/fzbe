        正常流程下，同一实验提交成功后会被标记为已完成，后续重复提交会被拒绝。
        实现中仍保留兼容性 upsert 分支，因此极少数历史/异常数据场景下可能返回 `200` 表示更新成功。
      operationId: submitReport
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/experimentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReportRequest'
      responses:
        '200':
          description: 兼容性更新成功（正常流程下较少出现）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitReportResponse'
        '201':

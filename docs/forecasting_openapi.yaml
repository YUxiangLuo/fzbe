openapi: 3.0.3
info:
  title: 需求预测与时间序列工具 API
  version: 1.3.0
  description: "本规范包含两类接口：\n1) 预测类 `/api/forecast`：支持 moving_average、exponential_smoothing、arima（自动选择\
    \ p、q，调用方提供 d）、\n   lstm（一次性训练+预测；调用方仅提供数据与特征配置）。\n2) 工具类 `/api/tools/*`：ADF 平稳性检验与差分阶数测试。\n"
servers:
- url: https://api.example.com
tags:
- name: Forecast
  description: 需求预测相关接口
- name: Tools
  description: 时间序列检验与预处理工具
paths:
  /api/forecast:
    post:
      tags:
      - Forecast
      summary: 统一预测接口
      description: "通过 `method` 选择预测方法：\n  - `moving_average`：简单移动平均；\n  - `exponential_smoothing`：一次指数平滑；\n\
        \  - `arima`：自动寻优 p、q（最小化 AIC），d 由调用方提供；\n  - `lstm`：一次性训练+预测，仅需数据、特征与标准化配置。\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ForecastMovingAverageRequest'
              - $ref: '#/components/schemas/ForecastExponentialSmoothingRequest'
              - $ref: '#/components/schemas/ForecastArimaAutoRequest'
              - $ref: '#/components/schemas/ForecastLstmRequest'
              discriminator:
                propertyName: method
                mapping:
                  moving_average: '#/components/schemas/ForecastMovingAverageRequest'
                  exponential_smoothing: '#/components/schemas/ForecastExponentialSmoothingRequest'
                  arima: '#/components/schemas/ForecastArimaAutoRequest'
                  lstm: '#/components/schemas/ForecastLstmRequest'
            examples:
              movingAverage:
                summary: 移动平均示例
                value:
                  method: moving_average
                  product_id: '12345'
                  historical_data:
                  - 120
                  - 115
                  - 130
                  - 140
                  - 150
                  window_size: 3
                  forecast_periods: 2
                  time_unit: day
              exponentialSmoothing:
                summary: 指数平滑示例
                value:
                  method: exponential_smoothing
                  product_id: '12345'
                  historical_data:
                  - 120
                  - 115
                  - 130
                  - 140
                  - 150
                  alpha: 0.3
                  forecast_periods: 2
                  time_unit: day
              arimaAuto:
                summary: ARIMA（自动 p,q；用户传 d）示例
                value:
                  method: arima
                  product_id: '12345'
                  historical_data:
                  - 120
                  - 115
                  - 130
                  - 140
                  - 150
                  - 152
                  - 153
                  - 154
                  d: 1
                  forecast_periods: 6
                  time_unit: day
              lstm:
                summary: LSTM 示例
                value:
                  method: lstm
                  product_id: '12345'
                  data:
                    rows:
                    - timestamp: '2024-01-01'
                      sales_qty: 120
                      sales_amt: 2400
                      price: 20.0
                    - timestamp: '2024-01-02'
                      sales_qty: 115
                      sales_amt: 2300
                      price: 20.0
                  feature_config:
                    time_column: timestamp
                    target: sales_qty
                    feature_columns:
                    - sales_amt
                    - price
                    normalization:
                      method: minmax
                  forecast_periods: 7
                  time_unit: day
      responses:
        '200':
          description: 预测成功
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ForecastMovingAverageResponse'
                - $ref: '#/components/schemas/ForecastExponentialSmoothingResponse'
                - $ref: '#/components/schemas/ForecastArimaAutoResponse'
                - $ref: '#/components/schemas/ForecastLstmResponse'
              examples:
                movingAverage:
                  summary: 移动平均成功示例
                  value:
                    product_id: '12345'
                    method: moving_average
                    forecast:
                      horizon: 2
                      values:
                      - 145
                      - 147
                    params:
                      window_size: 3
                exponentialSmoothing:
                  summary: 指数平滑成功示例
                  value:
                    product_id: '12345'
                    method: exponential_smoothing
                    forecast:
                      horizon: 2
                      values:
                      - 146
                      - 147
                    params:
                      alpha: 0.3
                arimaAuto:
                  summary: ARIMA 成功示例
                  value:
                    product_id: '12345'
                    method: arima
                    used_params:
                      p: 2
                      d: 1
                      q: 1
                    model_selection:
                      criterion: aic
                      best_aic: 1175.22
                      search_space:
                        p_min: 0
                        p_max: 5
                        q_min: 0
                        q_max: 5
                    forecast:
                      horizon: 6
                      values:
                      - 160
                      - 162
                      - 165
                      - 167
                      - 169
                      - 170
                    diagnostics:
                      residual_lb_pvalue: 0.21
                      is_residual_white_noise: true
                lstm:
                  summary: LSTM 成功示例
                  value:
                    product_id: '12345'
                    method: lstm
                    forecast:
                      horizon: 7
                      timestamps:
                      - '2025-09-08'
                      - '2025-09-09'
                      - '2025-09-10'
                      - '2025-09-11'
                      - '2025-09-12'
                      - '2025-09-13'
                      - '2025-09-14'
                      values:
                      - 162
                      - 165
                      - 167
                      - 170
                      - 172
                      - 171
                      - 173
                    used_params:
                      normalization:
                        method: minmax
                      feature_columns:
                      - sales_amt
                      - price
                      target: sales_qty
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/tools/adf-test:
    post:
      tags:
      - Tools
      summary: ADF 单位根检验（多阶差分对比）
      description: 对 d=0..max_difference_order 的序列分别做 ADF，返回统计量表与推荐差分阶数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdfTestRequest'
            examples:
              default:
                value:
                  product_id: '12345'
                  time_series:
                  - 120
                  - 115
                  - 130
                  - 140
                  - 150
                  - 152
                  - 153
                  - 154
                  significance_level: 0.05
      responses:
        '200':
          description: 检验成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdfTestResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/tools/difference-test:
    post:
      tags:
      - Tools
      summary: 指定差分阶数的平稳性测试（ADF）
      description: 对传入的差分阶数 d 进行差分后做 ADF，返回是否平稳及相关统计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DifferenceTestRequest'
            examples:
              default:
                value:
                  product_id: '12345'
                  time_series:
                  - 120
                  - 115
                  - 130
                  - 140
                  - 150
                  - 152
                  - 153
                  - 154
                  difference_order: 1
                  significance_level: 0.05
      responses:
        '200':
          description: 检验成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DifferenceTestResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/tools/metrics:
    post:
      tags:
      - Tools
      summary: 计算预测与真实值的评价指标（RMSE/MAE/R²）
      description: 输入 y_true 与 y_pred，计算指定的评价指标；支持权重与 NaN 处理策略。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsRequest'
            examples:
              default:
                summary: 基础示例
                value:
                  y_true:
                  - 120
                  - 115
                  - 130
                  - 140
                  - 150
                  y_pred:
                  - 118
                  - 117
                  - 129
                  - 141
                  - 151
                  metrics:
                  - rmse
                  - mae
                  - r2
                  nan_policy: omit
                  decimal_places: 4
              withWeights:
                summary: 带权重示例
                value:
                  y_true:
                  - 10
                  - 12
                  - 13
                  - 15
                  y_pred:
                  - 9
                  - 13
                  - 14
                  - 16
                  sample_weight:
                  - 1
                  - 2
                  - 1
                  - 1
                  metrics:
                  - rmse
                  - mae
                  decimal_places: 3
      responses:
        '200':
          description: 计算成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
              examples:
                default:
                  summary: 结果示例
                  value:
                    rmse: 1.4142
                    mae: 1.2
                    r2: 0.9821
                    n_samples: 5
                    effective_samples: 5
                    input_summary:
                      len_y_true: 5
                      len_y_pred: 5
                      len_sample_weight: null
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: INSUFFICIENT_DATA
            message:
              type: string
              example: historical_data length must be >= 10 for d=1.
    ForecastBase:
      type: object
      required:
      - method
      - forecast_periods
      properties:
        method:
          type: string
          enum:
          - moving_average
          - exponential_smoothing
          - arima
          - lstm
        product_id:
          oneOf:
          - type: string
          - type: integer
        historical_data:
          type: array
          items:
            type: number
          minItems: 3
          description: 仅 non-LSTM 方法使用
        forecast_periods:
          type: integer
          minimum: 1
        time_unit:
          type: string
          description: 语义用途（day/week/month）
    ForecastMovingAverageRequest:
      allOf:
      - $ref: '#/components/schemas/ForecastBase'
      - type: object
        required:
        - historical_data
        - window_size
        properties:
          method:
            const: moving_average
          historical_data:
            type: array
            items:
              type: number
            minItems: 3
          window_size:
            type: integer
            minimum: 1
    ForecastExponentialSmoothingRequest:
      allOf:
      - $ref: '#/components/schemas/ForecastBase'
      - type: object
        required:
        - historical_data
        - alpha
        properties:
          method:
            const: exponential_smoothing
          historical_data:
            type: array
            items:
              type: number
            minItems: 3
          alpha:
            type: number
            exclusiveMinimum: 0
            maximum: 1
    ForecastArimaAutoRequest:
      allOf:
      - $ref: '#/components/schemas/ForecastBase'
      - type: object
        required:
        - historical_data
        - d
        properties:
          method:
            const: arima
          historical_data:
            type: array
            items:
              type: number
            minItems: 8
          d:
            type: integer
            enum:
            - 0
            - 1
            - 2
            description: 调用方提供的差分阶数
    ForecastLstmRequest:
      allOf:
      - $ref: '#/components/schemas/ForecastBase'
      - type: object
        required:
        - data
        - feature_config
        properties:
          method:
            const: lstm
          data:
            type: object
            required:
            - rows
            properties:
              rows:
                type: array
                minItems: 50
                items:
                  type: object
                  additionalProperties: true
          feature_config:
            type: object
            required:
            - time_column
            - target
            - feature_columns
            - normalization
            properties:
              time_column:
                type: string
              target:
                type: string
              feature_columns:
                type: array
                minItems: 1
                items:
                  type: string
              normalization:
                type: object
                required:
                - method
                properties:
                  method:
                    type: string
                    enum:
                    - minmax
                    - zscore
              missing:
                type: object
                properties:
                  strategy:
                    type: string
                    enum:
                    - ffill
                    - bfill
                    - interpolate
                    - drop
              time_features:
                type: object
                properties:
                  enable:
                    type: boolean
                  components:
                    type: array
                    items:
                      type: string
                      enum:
                      - dow
                      - month
                      - dom
                      - doy
                  cyclic:
                    type: boolean
              categorical:
                type: object
                properties:
                  columns:
                    type: array
                    items:
                      type: string
                  encoding:
                    type: string
                    enum:
                    - onehot
                    - target
    ForecastBaseResponse:
      type: object
      required:
      - method
      - forecast
      properties:
        product_id:
          oneOf:
          - type: string
          - type: integer
        method:
          type: string
        forecast:
          type: object
          required:
          - horizon
          - values
          properties:
            horizon:
              type: integer
            values:
              type: array
              items:
                type: number
    ForecastMovingAverageResponse:
      allOf:
      - $ref: '#/components/schemas/ForecastBaseResponse'
      - type: object
        properties:
          method:
            const: moving_average
          params:
            type: object
            properties:
              window_size:
                type: integer
    ForecastExponentialSmoothingResponse:
      allOf:
      - $ref: '#/components/schemas/ForecastBaseResponse'
      - type: object
        properties:
          method:
            const: exponential_smoothing
          params:
            type: object
            properties:
              alpha:
                type: number
    ForecastArimaAutoResponse:
      allOf:
      - $ref: '#/components/schemas/ForecastBaseResponse'
      - type: object
        properties:
          method:
            const: arima
          used_params:
            type: object
            required:
            - p
            - d
            - q
            properties:
              p:
                type: integer
              d:
                type: integer
              q:
                type: integer
          model_selection:
            type: object
            properties:
              criterion:
                type: string
                example: aic
              best_aic:
                type: number
              search_space:
                type: object
                properties:
                  p_min:
                    type: integer
                  p_max:
                    type: integer
                  q_min:
                    type: integer
                  q_max:
                    type: integer
          diagnostics:
            type: object
            properties:
              residual_lb_pvalue:
                type: number
                nullable: true
              is_residual_white_noise:
                type: boolean
                nullable: true
    ForecastLstmResponse:
      type: object
      required:
      - method
      - forecast
      properties:
        product_id:
          oneOf:
          - type: string
          - type: integer
        method:
          const: lstm
        forecast:
          type: object
          required:
          - horizon
          - values
          properties:
            horizon:
              type: integer
            timestamps:
              type: array
              items:
                type: string
            values:
              type: array
              items:
                type: number
        used_params:
          type: object
          properties:
            normalization:
              type: object
              properties:
                method:
                  type: string
                  enum:
                  - minmax
                  - zscore
            feature_columns:
              type: array
              items:
                type: string
            target:
              type: string
    AdfTestRequest:
      type: object
      required:
      - time_series
      properties:
        product_id:
          oneOf:
          - type: string
          - type: integer
        time_series:
          type: array
          minItems: 8
          items:
            type: number
        significance_level:
          type: number
          default: 0.05
          description: 常用 0.01 / 0.05 / 0.10
        max_difference_order:
          type: integer
          default: 2
          description: 对 d=0..max_difference_order 逐一检验
    AdfTestResponse:
      type: object
      required:
      - results
      - recommended_difference_order
      properties:
        product_id:
          oneOf:
          - type: string
          - type: integer
        results:
          type: array
          items:
            type: object
            required:
            - difference_order
            - adf_statistic
            - p_value
            - critical_values
            - is_stationary
            properties:
              difference_order:
                type: integer
              adf_statistic:
                type: number
              p_value:
                type: number
              aic:
                type: number
                nullable: true
              critical_values:
                type: object
                additionalProperties:
                  type: number
              is_stationary:
                type: boolean
        recommended_difference_order:
          type: integer
        recommendation:
          type: string
    DifferenceTestRequest:
      type: object
      required:
      - time_series
      - difference_order
      properties:
        product_id:
          oneOf:
          - type: string
          - type: integer
        time_series:
          type: array
          minItems: 8
          items:
            type: number
        difference_order:
          type: integer
          enum:
          - 0
          - 1
          - 2
        significance_level:
          type: number
          default: 0.05
    DifferenceTestResponse:
      type: object
      required:
      - difference_order
      - adf_statistic
      - p_value
      - critical_values
      - is_stationary
      properties:
        product_id:
          oneOf:
          - type: string
          - type: integer
        difference_order:
          type: integer
        adf_statistic:
          type: number
        p_value:
          type: number
        aic:
          type: number
          nullable: true
        critical_values:
          type: object
          additionalProperties:
            type: number
        is_stationary:
          type: boolean
        recommendation:
          type: string
    MetricsRequest:
      type: object
      required:
      - y_true
      - y_pred
      properties:
        y_true:
          type: array
          minItems: 1
          items:
            type: number
        y_pred:
          type: array
          minItems: 1
          items:
            type: number
        metrics:
          type: array
          items:
            type: string
            enum:
            - rmse
            - mae
            - r2
          description: 默认计算全部（rmse, mae, r2）。
        sample_weight:
          type: array
          items:
            type: number
          description: 可选。与 y_true 等长的权重。
        nan_policy:
          type: string
          enum:
          - omit
          - raise
          default: omit
          description: 遇到 NaN 的处理策略：omit=忽略对应样本，raise=返回错误。
        decimal_places:
          type: integer
          minimum: 0
          maximum: 10
          default: 4
          description: 结果小数位数。
    MetricsResponse:
      type: object
      properties:
        rmse:
          type: number
          nullable: true
        mae:
          type: number
          nullable: true
        r2:
          type: number
          nullable: true
        n_samples:
          type: integer
        effective_samples:
          type: integer
          description: 按 nan_policy 和 sample_weight 过滤后的样本数
        warnings:
          type: array
          items:
            type: string
        input_summary:
          type: object
          properties:
            len_y_true:
              type: integer
            len_y_pred:
              type: integer
            len_sample_weight:
              type: integer
              nullable: true
      required:
      - n_samples
      - effective_samples

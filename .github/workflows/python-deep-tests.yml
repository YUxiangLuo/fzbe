name: Python deep tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 18 * * 1-5"
  workflow_dispatch:
    inputs:
      profile:
        description: Deep-test profile to run
        required: true
        default: full
        type: choice
        options: [full, nightly, resource]

permissions:
  contents: read

concurrency:
  group: python-deep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  PYTHONHASHSEED: "20250308"
  TF_CPP_MIN_LOG_LEVEL: "3"
  TF_DETERMINISTIC_OPS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TF_NUM_INTRAOP_THREADS: "1"
  TF_NUM_INTEROP_THREADS: "1"

jobs:
  full:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==$(cat py/.uv-version)"
      - name: Install model and test dependencies
        run: ./py/install.sh --test
      - name: Verify committed deterministic datasets
        run: py/venv/bin/python py/deep_tests/support/generate_datasets.py --check
      - name: Run full seven-model deep tests
        run: py/venv/bin/python py/deep_tests/run.py --profile full

  nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.profile == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==$(cat py/.uv-version)"
      - name: Install model and test dependencies
        run: ./py/install.sh --test
      - name: Verify committed deterministic datasets
        run: py/venv/bin/python py/deep_tests/support/generate_datasets.py --check
      - name: Run nightly checkpoint and LSTM matrix
        run: py/venv/bin/python py/deep_tests/run.py --profile nightly
      - name: Run Linux resource and cleanup matrix
        run: py/venv/bin/python py/deep_tests/run.py --profile resource

  resource:
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'resource'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==$(cat py/.uv-version)"
      - run: ./py/install.sh --test
      - run: py/venv/bin/python py/deep_tests/run.py --profile resource

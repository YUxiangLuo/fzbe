name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: fangzhen_ci
      DB_PASSWORD: fangzhen_ci
      DB_DATABASE: fangzhen_ci
      JWT_SECRET: backend-ci-only-secret-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:4000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test:unit

      - name: Audit dependencies
        run: bun audit

  python-smoke:
    name: Python model smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install model dependencies
        run: ./py/install.sh

      - name: Run metrics smoke test
        run: py/venv/bin/python py/test/metrics_smoke.py

      - name: Run moving-average smoke test
        run: py/venv/bin/python py/test/ma_csv_smoke.py

name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: fangzhen_ci
      DB_PASSWORD: fangzhen_ci
      DB_DATABASE: fangzhen_ci
      JWT_SECRET: backend-ci-only-secret-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:4000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Validate OpenAPI contract
        run: bun run lint:openapi

      - name: Run unit tests
        run: bun run test:unit

      - name: Audit dependencies
        run: bun audit

  python-smoke:
    name: Seven-model lifecycle and parity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install model dependencies
        run: ./py/install.sh

      - name: Run metrics smoke test
        run: py/venv/bin/python py/test/metrics_smoke.py

      - name: Verify dataset numeric contract
        run: py/venv/bin/python py/test/data_contract_smoke.py

      - name: Run model review regression tests
        run: py/venv/bin/python py/test/review_regressions.py

      - name: Run moving-average smoke test
        run: py/venv/bin/python py/test/ma_csv_smoke.py

      - name: Run exponential-smoothing smoke test
        run: py/venv/bin/python py/test/es_csv_smoke.py

      - name: Run ARIMA smoke test
        run: py/venv/bin/python py/test/arima_csv_smoke.py

      - name: Run LSTM smoke test
        run: py/venv/bin/python py/test/lstm_csv_smoke.py

      - name: Run weighted-average smoke test
        run: py/venv/bin/python py/test/weighted_avg_csv_smoke.py

      - name: Run stacking smoke test
        run: py/venv/bin/python py/test/stacking_csv_smoke.py

      - name: Run boosting smoke test
        run: py/venv/bin/python py/test/boosting_csv_smoke.py

      - name: Run weighted-average with LSTM smoke test
        run: py/venv/bin/python py/test/weighted_avg_lstm_csv_smoke.py

      - name: Run stacking with LSTM smoke test
        run: py/venv/bin/python py/test/stacking_lstm_csv_smoke.py

      - name: Run boosting with LSTM smoke test
        run: py/venv/bin/python py/test/boosting_lstm_csv_smoke.py

      - name: Verify resumable production preparation including LSTM
        run: py/venv/bin/python py/test/production_preparation_smoke.py

      - name: Verify guided and standalone lifecycle parity
        run: py/venv/bin/python py/test/guided_standalone_parity.py

      - name: Verify guided and regular ensemble lifecycle parity
        run: py/venv/bin/python py/test/guided_ensemble_parity.py

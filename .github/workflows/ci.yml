name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: fangzhen_ci
      DB_PASSWORD: fangzhen_ci
      DB_DATABASE: fz_pr_ci
      JWT_SECRET: backend-ci-only-secret-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:4000
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fz_pr_ci
          MYSQL_USER: fangzhen_ci
          MYSQL_PASSWORD: fangzhen_ci
          MYSQL_ROOT_PASSWORD: fangzhen_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ufangzhen_ci -pfangzhen_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Validate OpenAPI contract
        run: bun run lint:openapi

      - name: Validate test inventory
        run: bun run test:list

      - name: Run unit tests
        run: bun run test:unit

      - name: Verify canonical phone migration against MySQL
        env:
          E2E_ALLOW_DB_RESET: "1"
        run: bun run test:system:user-phone-canonical

      - name: Audit dependencies
        run: bun audit

  python-smoke:
    name: Python deep gate and workflow suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONHASHSEED: "20250308"
      TF_CPP_MIN_LOG_LEVEL: "3"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install model dependencies
        run: ./py/install.sh --test

      # Unused imports and locals are how dead Python accumulated unnoticed:
      # a removed call site leaves the helper, its imports, and eventually a
      # whole unreachable branch behind. F401/F841 catch the first step.
      - name: Lint model layer for unused imports and locals
        run: |
          python -m pip install --disable-pip-version-check ruff
          python -m ruff check --select F401,F811,F821,F841 \
            py/src py/test py/deep_tests py/guided_model.py \
            py/guided_ensemble_model.py py/run_model.py \
            py/production_prepare_model.py

      - name: Run independent Python deep-test fast gate
        run: py/venv/bin/python py/deep_tests/run.py --profile fast

      - name: Run contract, smoke, parity, and regression workflows
        run: py/venv/bin/python py/test/run.py --profile ci

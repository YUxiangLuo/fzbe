[project]
name = "fangzhen-model-runtime"
version = "0.1.0"
description = "Python runtime for the Fangzhen forecasting models"
requires-python = ">=3.13,<3.14"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.4.4",
  "pandas==3.0.3",
  "pmdarima==2.1.1",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "statsmodels==0.14.6",
  "tensorflow==2.21.0",
]

[dependency-groups]
dev = [
  "ruff==0.16.4",
]

[tool.uv]
package = false
